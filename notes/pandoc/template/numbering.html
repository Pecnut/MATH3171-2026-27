<script>
	function doNumbering() {
		// The syntax to read the structured data from the yaml is horrible, template literals fix the problem but probably aren't widely supported enough.
		// Escaping line breaks is browser dependant. I don't know if there's a better way.
		// Note that the data from the yaml file is manipulated into an array, and then parsed back into strings later, but I didn't want to deal with the pandoc templating syntax longer than necessary.
		const supportedEnvsArrayString = ' .${ for(environmentCounters/pairs) }${ it.value[;;; .] }${sep}||| .${endfor}';
		const supportedEnvsArray = supportedEnvsArrayString.split("|||").map(inner => inner.split(";;;"));
		let numberWithin = parseInt('${numberWithinLevel}');
		if (isNaN(numberWithin)) numberWithin = 0;
		let counterOffset = parseInt('${counterOffset}');
		if (isNaN(counterOffset)) counterOffset = 0;
		let subcounterOffset = parseInt('${subcounterOffset}');
		if (isNaN(subcounterOffset)) subcounterOffset = 0;
		let problemCounter = parseInt('${problemCounter}');
		if (isNaN(problemCounter)) problemCounter = 1;
		const partLabels = 'abcdefghijklmnopqrstuvwxyz'.split('');

		function sanitiseSelector(selector) {
			// TeX labels often have colons which need escaping. encodeURI/component don't help here, so use regex.
			let sanitised = selector.replace(/\:/g, "\\\:");
			sanitised = sanitised.replace(/(^[\d])/, "\\3$$1 ");
			sanitised = sanitised.replace(/\//g, "\\\/");
			return sanitised;
		}

		function labelLinks() {
			console.log('Labelling links');
			const refs = document.querySelectorAll("a[data-reference-type='ref+label'], a[data-reference-type='ref+Label']");
			for (const ref of refs) {
				const ref_label = ref.getAttribute("data-reference");
				let ref_to = document.getElementById(ref_label);
				let ref_number = "???";
				if (ref_to !== null) {
					ref_number = ref_to.getAttribute("data-number");
					if (ref_to.nodeName === "SECTION" && ref_to.classList) {
						if (ref_to.classList.contains("level1")) {
							ref_number = "chapter " + ref_number;
						} else {
							ref_number = "§" + ref_number;
						}
					}
				} else {
					// If ref is for an equation, try to find MathJax equation number (fragile).
					try {
						const mathjax_ref = "mjx-eqn:" + ref_label;
						ref_to = document.getElementById(mathjax_ref);
						const ref_number_elements = ref_to.querySelectorAll("mjx-c");
						let ref_string = "";
						for (const element of ref_number_elements) {
							const character = element.getHTML();
							ref_string += character.replace(/['"]+/g, '');
						}
						ref_number = ref_string;
						ref.setAttribute("href", "#" + mathjax_ref.replace(/[\\]+/g, ''));
					} catch (err) {
						ref_number = "???";
						console.log("Error: ", err);
						console.log("Ref label: ", ref_label);
					}
				}
				ref.innerHTML = ref_number;
			}
		}

		function numberEnvs() {
			for (let levelSpec = 0; levelSpec <= numberWithin; levelSpec++) {
				const reqLevels = document.querySelectorAll(".level" + levelSpec);
				for (const level of reqLevels) {
					let levelCount = level.getAttribute("data-number");
					levelCount = String(parseFloat(levelCount) + counterOffset);
					levelCount = levelCount + (("." + subcounterOffset).repeat(numberWithin - levelSpec));
					for (const counter of supportedEnvsArray) {
						let envCount = 1;
						const envs = level.querySelectorAll(counter.join(", "));
						for (const env of envs) {
							env.setAttribute("data-number", levelCount + "." + envCount);
							envCount += 1;
						}
					}
				}
			}
		}

		function numberFigs() {
			// Figures should either be in a figure environment, or a table with image class imageTable thanks to the tableCaps filter.
			const figs = document.querySelectorAll("figure, .imageTable");
			let fig_no = 1;
			for (const fig of figs) {
				let cap = null;
				if (fig.nodeName === "FIGURE") {
					cap = fig.querySelector("figcaption");
					const img = fig.querySelector("img, embed");
					if (img) {
						const img_id = fig.getAttribute("id");
					}
				} else if (fig.nodeName === "TABLE") {
					cap = fig.querySelector("caption");
				}
				if (cap !== null) {
					cap.setAttribute("data-number", fig_no);
					fig.setAttribute("data-number", "Figure " + fig_no);
				}
				fig_no += 1;
			}
		}

		function numberGlobals() {
			// Numbers environments that use a global counter (e.g. problems on a sheet).
			const probsols = document.querySelectorAll(".problem, .solution");
			let prob_no = problemCounter;
			let partNo = 0;
			for (const probsol of probsols) {
				if (probsol.className === "problem") {
					prob_no += 1;
					partNo = 0;
					probsol.setAttribute("data-number", prob_no);
				} else {
					if (probsol.parentNode && probsol.parentNode.nodeName === "LI") {
						const partLabel = partLabels[partNo];
						probsol.setAttribute("data-number", prob_no.toString() + partLabel);
						partNo += 1;
					} else {
						probsol.setAttribute("data-number", prob_no);
					}
				}
			}
		}

		// labelLinks() should occur last, so that the data-numbers have been correctly set first.
		numberEnvs();
		numberFigs();
		numberGlobals();
		labelLinks();
		console.log('Numbering complete');
	}
</script>
